<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2545">
<title>Route Directory</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Route Dir">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">&#9679;</span>
      <div class="brand-text">
        <h1>Route Directory</h1>
        <p class="brand-sub"><span id="stopCountText">loading stops&hellip;</span><span id="refreshCountdown" class="refresh-countdown" hidden></span></p>
      </div>
    </div>
    <button id="uploadBtn" class="upload-btn" aria-label="Submit a walkthrough video">Upload</button>
  </div>
</header>

<main>
  <div class="search-wrap">
    <input id="searchInput" type="text" inputmode="numeric" autocomplete="off"
      placeholder="Search by account number&hellip;" aria-label="Search stops by account number">
    <div class="sort-row">
      <label for="sortSelect" class="sort-label">Sort by</label>
      <select id="sortSelect" aria-label="Sort stops">
        <option value="name">Site Name (A&ndash;Z)</option>
        <option value="account">Account Number</option>
      </select>
    </div>
  </div>

  <p id="statusLine" class="status-line" role="status"></p>

  <div id="results"></div>

  <div id="emptyState" class="empty-state" hidden>
    <p id="emptyTitle" class="empty-title">No match on the board.</p>
    <p id="emptySub" class="empty-sub">Search is by account number only.</p>
  </div>
</main>

<div id="videoModal" class="video-modal" hidden>
  <div class="video-modal-inner">
    <div class="video-modal-head">
      <span id="videoModalTitle" class="video-modal-title"></span>
      <button id="videoModalClose" type="button" class="video-modal-close" aria-label="Close video">&#10005;</button>
    </div>
    <video id="videoPlayer" class="video-modal-player" controls playsinline webkit-playsinline></video>
  </div>
</div>

<div id="imageModal" class="video-modal" hidden>
  <div class="video-modal-inner">
    <div class="video-modal-head">
      <span id="imageModalTitle" class="video-modal-title"></span>
      <button id="imageModalClose" type="button" class="video-modal-close" aria-label="Close photo">&#10005;</button>
    </div>
    <!-- Grid view: one thumbnail per photo. Tapping a thumbnail zooms it to
         fill the modal (zoomed view below); tapping the zoomed image goes
         back to this grid. Single-photo sites just show one thumbnail. -->
    <div id="imageModalGrid" class="image-modal-grid"></div>
    <img id="imageModalImg" class="video-modal-player" alt="" hidden>
  </div>
</div>

<div id="loginModal" class="login-modal" hidden>
  <div class="login-modal-inner">
    <div class="login-modal-head">
      <span class="login-modal-title">Store Manager Login</span>
      <button id="loginModalClose" type="button" class="video-modal-close" aria-label="Close login">&#10005;</button>
    </div>
    <form id="loginForm" class="login-form" novalidate>
      <p class="login-lede">Enter your store login and password to submit a walkthrough video.</p>
      <label class="login-field">
        <span class="login-label">Store login</span>
        <input id="loginStore" type="text" inputmode="numeric" autocomplete="off" placeholder="e.g. 3" required>
      </label>
      <label class="login-field">
        <span class="login-label">Password</span>
        <input id="loginPass" type="password" inputmode="numeric" autocomplete="off" placeholder="Password" required>
      </label>
      <p id="loginError" class="login-error" role="alert" hidden></p>
      <button type="submit" class="login-submit">Log in and open form</button>
    </form>
  </div>
</div>

<footer class="foot">
  <span id="updatedLine">&nbsp;</span>
  <span id="offlineTag" class="offline-tag" hidden>OFFLINE COPY</span>
</footer>

<script src="app.js"></script>
</body>
</html>
